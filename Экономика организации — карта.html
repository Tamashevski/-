Экономика организации
 Тема 1. Организация и её внешняя среда
  1. Структура национальной экономики
   Основные понятия
    Структура — совокупность устойчивых связей объекта, обеспечивающих целостность и сохранение основных свойств при внешних и внутренних изменениях
    Национальная экономика — исторически сложившаяся в границах страны система: взаимосвязанные отрасли, виды деятельности и территориальные комплексы, охватывающие все формы хозяйства
    Структура экономики — устойчивые количественные соотношения между её составными частями
    Виды структур по критерию классификации: воспроизводственная, социальная, территориальная, отраслевая
   а) Воспроизводственная структура
    Характеризует соотношение доходов субъектов, представляющих части совокупного общественного продукта
    Показывает, как субъекты воспроизводят производственно-экономический потенциал через потоки товаров и услуг
    Состоит из агрегированных секторов, связанных экономическими отношениями
    1) Домашние хозяйства
     Собственники и поставщики факторов производства
     Продают или сдают в аренду факторы → получают доход
     Доход делится на потребление и сбережения
     Потребляя блага — воспроизводят трудовые ресурсы
     Сберегая и инвестируя — воспроизводят капитал
    2) Предприятия и организации (зарегистрированные в стране)
     Предъявляют спрос на факторы производства
     Организуют производство и обеспечивают предложение товаров и услуг
     Инвестируя часть дохода, воспроизводят капитал
    3) Государство (все госинституты и учреждения)
     Производит общественные блага: безопасность, экология, госуслуги, социальная инфраструктура
     Заботится об эффективности предпринимательского сектора
     Создаёт законодательную базу
     Обеспечивает соблюдение законов
    4) Внешнеэкономический сектор
     Часть деятельности отечественных и иностранных субъектов, связанная с внешней торговлей (экспорт, импорт)
     Движение капитала и валют в страну и из неё
   б) Социальная структура
    Деление общества на социальные группы: общности, классы, слои
    Виды по главному элементу: групповая, классовая, общностная, организационная
    Социальная группа — люди с общими признаками, выполняющие общественно необходимую функцию в разделении труда
    Признаки: пол, возраст, национальность, профессия, место жительства, доход, образование
   в) Территориальная структура
    Деление национальной экономики на экономические районы (регионы)
    Доли областей в ВВП РБ, 2021 г.
     г. Минск — 31,8% (более 15%)
     Минская обл. — 18,6% (более 15%)
     Гомельская — 12,2%; Брестская — 10,7%; Гродненская — 10,3% (10–15%)
     Витебская — 8,7%; Могилёвская — 7,7% (менее 10%)
   г) Отраслевая структура
    Деление хозяйства на отрасли (сферы деятельности)
    Отрасль — качественно однородные группы хозединиц, выпускающих однотипную продукцию по сходным технологиям независимо от размещения
    Международная статистика: промышленность, сельское хозяйство, услуги, прочие отрасли
    В РБ отдельно выделяют: строительство; транспорт и связь; торговлю и общественное питание
    I. Производственная сфера
     Материальное производство
      Производство материальных продуктов (промышленность, сельское хозяйство)
       Подразделение I — производство средств производства
       Подразделение II — производство предметов потребления
      Материальные услуги — действия с материальным продуктом: автосервис, ремонт, ЖКХ, бытовые, транспортные, гостиничные, общепит
     Нематериальное производство
      Социально-культурные услуги: удовлетворение духовных, интеллектуальных, этических потребностей
      Примеры: страхование, банки, финансы, право, образование, спорт, туризм, медицина, аренда, связь
    II. Непроизводственная сфера
     Создаёт нематериальные блага без стоимостного выражения
     Сохранение и развитие личности, чести, достоинства, репутации, авторства
     Примеры: общественная деятельность, безопасность, судебная защита, наука, религия, искусство
     Обеспечивает расширенное воспроизводство социальных и трудовых ресурсов; роль постоянно растёт
    Группы показателей отраслевой структуры
     I — количественное соотношение отраслей и межотраслевых комплексов
     II — структурные сдвиги за период
     III — производственные связи внутри и между отраслями
    Формы производственных связей
     Внутриотраслевые — доля продукции собственного производства, используемой отраслью
     Межотраслевые прямые — напрямую между предприятиями двух отраслей
     Межотраслевые косвенные — через другие отрасли
     Межотраслевые связи — доля продукции отрасли, направленной на переработку в другие отрасли
    Показатели
     Удельный вес выпуска отрасли в общем выпуске
     Удельный вес занятых в отрасли
     Удельный вес стоимости ОПФ отрасли
     Коэффициент опережения = темп роста отрасли / темп роста всего производства
     Чем выше доли и коэффициент опережения, тем важнее отрасль
    Факторы формирования
     НТП; уровень и характер специализации
     Потребность экономики в продукции отрасли
     Потребность людей в видах продукции
     Межгосударственная специализация и кооперирование
  2. Понятие организации, цель и задачи
   Субъект хозяйствования — участник экономической деятельности с экономической свободой, самостоятельными решениями и экономической ответственностью
   Хозяйствование включает: профессионально-трудовую деятельность и элементы управления (собрание акционеров, совет директоров, правление)
   Предприятие — самостоятельный субъект, созданный по закону для выпуска продукции, работ, услуг; цель — удовлетворить потребности потребителей и обеспечить функционирование себя и работников
   Регламентирующие документы
    Гражданский, Инвестиционный, Налоговый, Трудовой кодексы РБ
    Декреты и указы Президента
    Другие законодательные акты
   Модель «вход — выход»
    Вход: материально-технические, трудовые, информационные ресурсы
    Выход: готовая продукция (работы, услуги)
   Основные характеристики
    Производственно-техническое единство — общность процессов, капитала, технологии
    Организационное единство — единое руководство, единый план
    Экономическое единство — общность ресурсов и экономических результатов
   Функции
    Обеспечение потребителей продукцией
    Зарплата, условия труда, профессиональный рост персонала
    Создание рабочих мест
    Конкурентоспособность продукции, гибкое обновление
    Ускорение НТП и освоение новой техники
    Охрана окружающей среды
   Задачи
    Максимальное удовлетворение спроса
    Увеличение рынка сбыта
    Самоокупаемость и самофинансирование
    Насыщение рынка качественными товарами
    Повышение культурного уровня общества
    Реализация творческого потенциала сотрудников
   Классификация предприятий
    Отраслевая принадлежность: промышленность, сельское хозяйство, строительство, транспорт и связь, торговля, услуги, прочие
    Форма собственности
     Государственные: республиканской и коммунальной собственности
     Частные
    Организационно-правовой статус: товарищества и общества, кооперативы, унитарные предприятия
    Цель деятельности: коммерческие / некоммерческие
    Вид деятельности
     Материальное производство: добывающие, перерабатывающие, грузовой транспорт, склады, оптовая торговля
     Сфера услуг: банки, страхование, пассажирский транспорт, консалтинг, здравоохранение, образование, досуг
    Производственный цикл: непрерывный / прерывный
    Структура продукции: многопрофильные, специализированные, комбинированные, узкоспециализированные
    Размер: крупные, средние, малые
    Воздействие на предмет труда: добывающие / перерабатывающие
    Назначение продукции: производственные / непроизводственные
    Устойчивость во времени: сезонные / круглогодичные
    Доминирующий фактор: трудоёмкие, материалоёмкие, энергоёмкие, капиталоёмкие, наукоёмкие
    Иностранный капитал: совместные, иностранные, национальные
   Коммерческие — цель получение прибыли
   Некоммерческие — социальные, природоохранные, благотворительные, культурные, научные, управленческие цели, охрана здоровья, спорт, защита прав, разрешение споров, юрпомощь
  3. Организационно-правовые формы
   Организационная форма — порядок первоначального создания имущества и использования прибыли
   Правовая форма — комплекс норм, определяющих отношения собственников между собой, с другими субъектами и властью
   Основание: Гражданский кодекс РБ № 218-З от 07.12.1998, глава 4 «Юридические лица»
   I. Хозяйственные товарищества и общества
    Коммерческие организации с уставным фондом, разделённым на доли (акции)
    а) Хозяйственные товарищества
     Полное товарищество
      Участники (полные товарищи) по договору ведут предпринимательскую деятельность от имени товарищества
      Солидарно несут субсидиарную ответственность всем своим имуществом
     Коммандитное товарищество
      Полные товарищи — ведут дело, отвечают всем имуществом
      Вкладчики (коммандиты) — рискуют только в пределах вклада, в управлении не участвуют
     Достоинства: лёгкость организации, больше финансовых ресурсов, совместное управление
     Недостатки
      Неограниченная ответственность за долги независимо от виновника
      Разногласия между партнёрами, несогласованная политика
      Ограниченная жизнь: выход или смерть партнёра ведёт к распаду
      Ограниченность финансовых ресурсов
      Сложность ликвидации и раздела имущества
    б) Хозяйственные общества
     ООО
      Уставный фонд разделён на доли, размер которых определён уставом
      Участники не отвечают по обязательствам, рискуют в пределах вкладов
      Наиболее распространённая форма юрлица в РБ
     ОДО
      Уставный фонд разделён на доли
      Участники солидарно несут субсидиарную ответственность в пределах, определённых уставом (не ниже законодательного минимума)
     Преимущества ООО и ОДО
      Ответственность ограничена вкладом
      Быстрое и дешёвое создание
      Размер уставного капитала определяют сами
      Возможность госзаказов
      Упрощённая система налогообложения (6%)
     Недостатки ООО и ОДО
      Нельзя привлекать инвестиции эмиссией акций
      Нет выхода на фондовую биржу
      Нельзя выпускать облигации
     Акционерное общество (АО)
      Уставный фонд разделён на акции одинаковой номинальной стоимости
      Акционеры рискуют в пределах стоимости своих акций
      ОАО — акции размещаются и обращаются среди неограниченного круга лиц
      ЗАО — акции только среди акционеров и ограниченного круга лиц
      Преимущества: эмиссия акций, биржевое обращение, привлекательность для инвесторов
      Недостатки
       Сложная и дорогая процедура создания и управления
       Минимальный уставный фонд — 400 базовых величин
       Расходы на регистрацию сделок с ценными бумагами
       Местонахождение — только нежилое помещение
     Дочернее общество — основное общество определяет его решения через преобладающее участие или договор
     Зависимое общество — другое общество имеет 20% и более голосов
   II. Производственный кооператив (артель)
    Коммерческая организация на основе членства
    Обязанности участников: паевой взнос + личное трудовое участие
    Субсидиарная ответственность в равных долях, не меньше годового дохода в кооперативе
    Достоинства и недостатки совпадают с товариществами
   III. Унитарное предприятие (УП)
    Учреждается по решению собственника имущества
    Имущество неделимо, не распределяется по вкладам, долям, паям, в т.ч. между работниками
    Собственник не отвечает по обязательствам УП (кроме случаев ГК)
    Виды
     Республиканское — собственность РБ; хозяйственное ведение или оперативное управление
     Коммунальное — собственность административно-территориальной единицы; хозяйственное ведение
     Частное — собственность физлица (супругов) или юрлица
     На праве хозяйственного ведения — по решению собственника
     На праве оперативного управления (казённое) — по решению Правительства на базе госимущества
     К(Ф)Х — сельхозпроизводство гражданина или семьи на личном труде и земельном участке
    Достоинства
     Один учредитель самостоятельно принимает решения
     Местонахождение может быть в жилом помещении учредителя
     Учредитель может быть директором по совместительству
     Можно обходиться без главного бухгалтера
     Простая структура: обязателен только руководитель
    Недостатки
     При смерти учредителя-директора УП может долго оставаться неуправляемым
     Сложность «выхода» из бизнеса
   Некоммерческие организации
    Два основных типа: на основе членства / на основе объединения имущества
    Общественные и религиозные организации — добровольные объединения граждан для нематериальных потребностей
    Республиканские государственно-общественные объединения — государственно значимые задачи
    Ассоциации и союзы — координация деятельности и защита общих интересов
    Фонды — без членства, на добровольных имущественных взносах, общественно полезные цели
    Учреждения — создаются собственником для управленческих, социально-культурных функций, финансируются им
    Потребительский кооператив — удовлетворение материальных потребностей членов через паевые взносы
    Некоммерческие на членстве
     Общественное объединение — международные, республиканские, местные; детские и молодёжные
     Религиозная организация — общины, объединения, монастыри; руководитель — гражданин РБ
     Политическая партия — политические цели, участие в выборах
     Профессиональный союз — защита трудовых и социально-экономических прав
  4. Объединения организаций
   Принципы создания
    Добровольность вхождения и выхода
    Сохранение хозяйственной самостоятельности
    Договорная основа отношений
    Свобода выбора организационной формы
    Соблюдение антимонопольного законодательства
   1. Хозяйственная ассоциация
    Добровольное объединение организаций разных отраслей для решения научно-технических проблем и представления интересов
    Может: заключать договоры, брать кредиты, вести ВЭД, создавать совместные и хозрасчётные организации
    Управление: высший орган, исполнительный орган, исполнительный аппарат
   2. Концерн
    Добровольная централизация производственных, научно-технических, инвестиционных, финансовых и внешнеэкономических функций
    Жёсткий центральный контроль капвложений, НИОКР, финансов + хозяйственная самостоятельность подразделений
    Участники не могут входить в другие объединения
    Виды: отраслевые, межотраслевые
    Примеры РБ: «Белнефтехим», «Беллегпром», «Белместпром», «Белэнерго», «Белресурсы», «Белтопгаз»
   3. Консорциум
    Временное соглашение фирм и банков для крупного проекта или программы; инициатором может быть государство
    Цель — минимизировать риск каждого участника в рискованных проектах
    Ресурсы участников на паевой основе, возможны заёмные средства
    Условия
     Договор с долями в затратах и прибыли
     Один участник избирается главой
     Участники сохраняют самостоятельность и могут входить в другие объединения
     После выполнения задачи консорциум прекращается
    Преимущества: гибкость, разнообразие форм, отсутствие жёстких требований
   4. Холдинг
    Головная компания с контрольными пакетами акций, управляющая и контролирующая
    Регулируется Указом № 385 от 07.10.2021; сам не является юрлицом
    Контрольный пакет даёт право голоса для единой политики
    Виды
     Многоуровневый — дочерние АО сами владеют контрольными пакетами других
     Одноуровневый — дочерние АО не владеют контрольными пакетами
     Смешанный — владеет пакетами и ведёт другую деятельность
     Чистый — только владеет пакетами
    Преимущества: концентрация капитала для инноваций, снижение риска, стабильность доходов
    Недостатки: монополизм, поддержка нерентабельных организаций за счёт рентабельных
   5. Финансово-промышленная группа (ФПГ)
    Объединение организаций, кредитно-финансовых и инвестиционных институтов для скоординированной деятельности
    Обязательно: производственные организации + банки
    С участниками из СНГ — транснациональная; по межправсоглашению — межгосударственная
    Позволяет: вертикальная интеграция, финансирование цепочки, снижение издержек, крупные инвестиции
    Характеристики: общая стратегия, общая политика, добровольность, юридическая самостоятельность
    Принципы: технологически связанные производства, холдинговые и трастовые отношения, против монополизма, экспертиза
    Отрасли: металлургия, химия, машиностроение, лёгкая промышленность, АПК
   6. Союз — по отраслевому, территориальному признаку; без совместной производственной деятельности; прогнозы, конференции, обмен опытом; на членских взносах
   7. Картель
    Обычно одна отрасль; совместная коммерческая деятельность
    Регулирование сбыта через квоты, цены, условия реализации
    Признаки: договорной характер, самостоятельность, совместная реализация
   8. Синдикат — разновидность картеля: сбыт через единый сбытовой орган (горнодобыча, металлургия, химия)
   9. Трест — слияние в производственный комплекс с потерей юридической и хозяйственной самостоятельности; удобен для комбинированного производства
   10. Кластер
    Группа взаимосвязанных компаний, поставщиков, НИИ, вузов на одной территории
    Признаки
     Горизонтальные и вертикальные связи
     Одна географическая территория
     Законченный производственный цикл
     Единая инфраструктура, научный центр, неформальные отношения
    Виды
     Региональный — вокруг научного или промышленного центра
     Вертикальный — цепочка «поставщик — производитель — продавец — клиент»
     Горизонтальный — разные отрасли в мегакластер (химический, агропромышленный)
  5. Создание и прекращение деятельности
   Жизненный цикл: 1) создание → 2) хозяйственная деятельность → 3) прекращение
   Этап 1. Создание
    Последовательность
     1) Идея, изучение рынка, поставщиков, соучредителей, источников уставного фонда
     2) Учредительное собрание: выбор формы, утверждение документов, назначение директора, протокол
     3) Госрегистрация: свидетельство, печати, учёт в ИМНС, статистике, ФСЗН, ЭЦП, счёт в банке
     4) Найм персонала, имущество, кредиты, бизнес-процессы
    Способы образования юрлица
     Распорядительный — по распоряжению собственника
     Разрешительный — после разрешения госоргана
     Явочно-нормативный — без разрешения, орган проверяет порядок; основной в РБ
    Учредительные документы
     Учредительный договор — отношения учредителей и их обязательства
     Устав — правила деятельности, права и обязанности
     Обязательное содержание: наименование, местонахождение, цели, управление, уставный фонд, имущество, прибыль и убытки, реорганизация и ликвидация
     Устав ООО: наименование, участники, местонахождение, уставный фонд, доли, управление, филиалы, выход участника, переход доли
    Госрегистрация — легализация деятельности; без неё деятельность незаконна
     Органы: Нацбанк, Минфин (страхование), администрации СЭЗ, Минюст, МИД, облисполкомы и Мингорисполком, горисполкомы
     Документы: заявление, устав в 2 экз. и электронно, документ об уплате госпошлины
     Отказ: неполный пакет, нарушения в заявлении, ненадлежащий орган
     Итог: запись в Едином государственном регистре и свидетельство
   Этап 2. Хозяйственная деятельность
    Имущество
     Недвижимое — прочно связано с землёй: здания, сооружения, незавершённое строительство, воздушные и морские суда
     Движимое — транспорт, ценные бумаги и др.
    Источники имущества
     Собственный капитал: уставный фонд, прибыль, специальные фонды
     Заёмный капитал: кредиты, бюджетные ассигнования, дотации, пожертвования
    Организационные структуры управления
     Линейная — один непосредственный руководитель; мелкие и средние фирмы
     Линейно-функциональная — линейные решают, функциональные помогают готовить решения
     Линейно-штабная — штабные специалисты при руководителях без права решений
     Функциональная — органы специализированы по функциям, их указания обязательны
     Проектная — временная команда под задачу, распускается по завершении
     Матричная — двойное подчинение: функциональному руководителю и руководителю проекта
     Дивизионная — главные фигуры руководители отделений по продукту, потребителю, региону
    Формы общественной организации производства
     1. Концентрация — сосредоточение выпуска на крупных предприятиях
      Агрегатная — рост мощности единицы оборудования
      Технологическая — укрупнение цехов и переделов
      Заводская — увеличение размеров предприятий
      Организационно-хозяйственная — объединения: горизонтальные, вертикальные, конгломераты
     2. Специализация — выпуск однородной продукции или её частей
      Предметная — готовые изделия (одно- и многопредметная)
      Подетальная — детали и узлы (подшипники, запчасти)
      Технологическая (стадийная) — отдельные стадии (прядильные, ткацкие фабрики)
      Показатели: уровень специализации отрасли, доля профильной продукции
     3. Кооперирование — длительные связи по совместному изготовлению изделия
      По отраслям: внутри- и межотраслевое
      По территории: внутри- и межрайонное
      По специализации: предметное, подетальное, технологическое
      Коэффициент кооперирования — доля покупных изделий и полуфабрикатов
     4. Комбинирование — разноотраслевые производства на одном комбинате
      Вертикальное — последовательные стадии переработки сырья
      Горизонтальное — разноотраслевая продукция на разных ступенях
      Смешанное
      Эффект: использование отходов, экономия на вспомогательных службах и транспорте, расширение сырьевой базы
     5. Размещение
    Обязанности в процессе деятельности: платить налоги, вести учёт, работать безубыточно, обновлять учредительные документы
   Этап 3. Прекращение деятельности
    Реорганизация — преобразование юрлица; правопреемник сохраняет обязательства
     Добровольная (решение владельцев) / принудительная (инициатор государство)
     Когда целесообразна: нецелесообразна деятельность, пересмотр производства, давление конкурентов, неплатёжеспособность, поглощение
     Присоединение — одна компания присоединяется к другой, новое юрлицо не образуется
     Преобразование — смена организационно-правовой формы
     Разделение — активы делятся между правопреемниками
     Слияние — объединение в новую компанию
     Выделение — из компании выводятся новые юрлица
    Реструктуризация — изменение структуры под воздействием среды
     Виды: оперативная, стратегическая, комплексная, частичная
     Задачи: защита интересов владельцев, защита от поглощения, оптимизация процессов, снижение риска банкротства, налоговая оптимизация, избавление от неликвидов
     Предпосылки: разные рынки, состояние производства, конкурентоспособность, инвестпривлекательность, качество
    Банкротство (Закон № 415-З от 13.07.2012)
     Устойчивая неплатёжеспособность, признанная экономическим судом с ликвидацией
     Причины: низкая конкурентоспособность, высокие издержки, малые продажи, нехватка капитала, плохое управление
     Ложное — заведомо ложное объявление о несостоятельности
     Преднамеренное — умышленное создание долгов
     Инициаторы: собственник, кредиторы, органы власти, прокуратура, работники, госорган по банкротству
     Процедуры: защитный период, конкурсное производство (санация), мировое соглашение
     Санация
      Цель — восстановить платёжеспособность; вводит экономический суд
      Управляющий публикует объявление и разрабатывает план санации
      План: имущество, долги, источники погашения, регламент деятельности
      Меры: взыскание дебиторки, помощь собственника, перепрофилирование, закрытие нерентабельного, продажа части имущества, отсрочка налогов, допэмиссия
      Кредиторы отклоняют план, если он невыполним, без конкретных мер и источников
      Оздоровление: конкурентоспособная продукция, маркетинг, оптимизация затрат, управленческий учёт, мотивация
    Ликвидация — исключение из реестра и полное прекращение деятельности
     По решению: собственника, экономического суда, регистрирующего органа
     Этапы
      1) Решение, назначение ликвидатора и сроков
      2) Уведомление регистрирующего органа
      3) Инвентаризация имущества и обязательств
      4) Увольнение работников (п. 1 ст. 42 ТК), выходное пособие
      5) Взыскание дебиторской задолженности
      6) Образцы подписей на ликвидатора
      7) Проверки госорганов, промежуточный ликвидационный баланс
      8) Расчёты с кредиторами и учредителями
      9) Окончательный ликвидационный баланс
      10) Закрытие расчётного счёта
      11) Сдача документов в архив
      12) Исключение из Единого государственного регистра

    Источник ресурсов для поддержания внутреннего потенциала

    Система законодательных, исполнительных и контролирующих мер для реализации программ развития
    Функции государства
     Нормативная правовая основа
     Правопорядок и национальная безопасность
     Стабилизация экономики
     Социальная защита
     Защита конкуренции
    Объекты: экономика страны и регионов, отраслей, предприятий
    Инструменты: законы, налоги, нормы амортизации, таможенные пошлины, бюджетные расходы, цены

 Тема 3. Производственная мощность и программа
  1. Производственная мощность
   Понятие — способность средств труда (машин, оборудования, площадей) к максимальному выпуску качественной продукции в плановой номенклатуре при эффективном использовании оборудования и времени
   Исходный показатель для планирования производственной программы
   Баланс производственной мощности (ежегодно)
    ПМвх — входная: по количеству оборудования на начало периода
    ПМвв — ввод: модернизация, реконструкция, техперевооружение
    ПМвыб — выбытие: выбытие, передача, продажа ОПФ, смена режима работы
    ПМвых — выходная: мощность на конец периода (ПМвх + ПМвв − ПМвыб)
    Среднегодовая мощность
     ПМср = ПМвх + ПМвв · tдейств / 12 − ПМвыб · tбездейств / 12
     tдейств — месяцы действия введённых мощностей
     tбездейств — полные месяцы бездействия выбывших
   Расчётные показатели
    Мощность оборудования (площади): ПМ = П / Зоб
     П — пропускная способность (станко-ч, м²·ч)
     Зоб — объёмная загрузка
    Пропускная способность оборудования: Поб = n · Dр · ts · S · (1 − Нр/100)
     n — количество единиц оборудования
     Dр — рабочие дни в году
     ts — продолжительность смены
     S — число смен
     Нр — потери времени на плановый ремонт, %
    Пропускная способность площади: П = F · Dр · ts · S · (1 − Нр/100), F — площадь, м²
    Объёмная загрузка: Зоб = t / Кв (трудоёмкость / коэффициент выполнения норм)
    Коэффициент использования мощности: Кипм = Производственная программа / ПМср
   Пути улучшения использования
    Технические: высокоэффективные технологии и оснастка, новые материалы, механизация, автоматизация, модернизация, унификация
    Организационные: специализация цехов, поточные методы, соответствие техпроцесса парку оборудования
    Экономические: стимулирование персонала, планирование мощности, финансирование инноваций
    Социальные: условия труда и отдыха, повышение квалификации
    Экологические: очистка воздуха, чтобы оборудование не выходило из строя раньше времени
  2. Производственная программа
   Основной раздел бизнес-плана: объём выпуска по номенклатуре, ассортименту и качеству в натуральном и стоимостном выражении
   Отражает: направления развития, связи с другими предприятиями, профиль, специализацию и комбинирование
   Номенклатура — укрупнённый перечень наименований изделий
   Ассортимент — разновидности внутри номенклатуры: типоразмеры, сорта, марки, фасоны
   Разделы
    1. Плановое задание по объёму, номенклатуре, ассортименту
    2. План объёма продаж
    3. План новых технологий, специализации и кооперирования
    4. План выпуска на экспорт
    5. План повышения качества
   Подходы к формированию: от имеющихся ресурсов / от потребности в продукции
   Исходные данные
    Уставные виды деятельности
    Фактическое выполнение программы прошлых периодов
    Спрос; рекламации и замечания по качеству
    Доли продукции по уровням качества; реализация по месяцам и кварталам
    Расчёты производственной мощности
    Прогрессивные нормы и нормативы
    Стратегические решения руководства
   Ключевые вопросы программы
    Что и сколько производить?
    В какие сроки?
    Какого качества?
    Сколько можно выпустить дополнительно при срочных заказах?
    Каков нижний предел выпуска до консервации?
    Сколько ресурсов нужно и как их обеспечить?
   Этапы обоснования
    1) Номенклатура и ассортимент в натуре с учётом спроса и оборудования
    2) Объём каждого изделия: реализация ± изменение остатков
    3) Обоснование производственных мощностей
    4) Стоимостные показатели
   Измерители
    Натуральные (шт., т, м) — специализация и доля рынка; только для однородной продукции
    Трудовые (часы, минуты) — внутрипроизводственное планирование, трудоёмкость
    Стоимостные (руб.) — применяются вместе с натуральными и трудовыми
   Продукция по степени готовности
    Товарная — прошла все стадии, соответствует ГОСТ и ТУ, принята ОТК, упакована, сдана на склад
    Незавершённая — на разных стадиях производственного цикла
    Полуфабрикаты собственного производства — закончены в одном цехе, дорабатываются в другом
   Стоимостные показатели
    Товарная продукция (ТП) — стоимость готовой продукции, полуфабрикатов и комплектующих для реализации и собственных нужд
    Валовая продукция (ВП) — общий объём производства, включая незавершённое
     ВП = ТП + НЗПк.г. − НЗПн.г.
     Включает работы промышленного характера и производственные услуги
    Внутризаводской оборот — продукция и услуги цехов, потреблённые другими цехами
     Переработка своих полуфабрикатов
     Своя электроэнергия, пар, вода, сжатый воздух, холод
     Свои инструменты, штампы, запчасти
     Материалы для текущих ремонтов, тара собственного производства
    Реализованная продукция (РП) — отгруженная и оплаченная
     РП = ТП + ГПн.г. − ГПк.г.
     ГП — остатки готовой продукции на складе
    Чистая продукция (ЧП) — вновь созданная (добавленная) стоимость
     ЧП = ЗП + отчисления ФСЗН + Белгосстрах + прибыль
    Условно-чистая продукция: УЧП = ЧП + амортизационные отчисления
   Для чего нужны итоговые показатели: загрузка оборудования, потребность в ресурсах, темпы роста, производительность, фондоотдача, материалоёмкость, выручка
 Тема 4. Производственные ресурсы и их использование
  1. Трудовые ресурсы и персонал
   Факторы производства: рабочая сила, предметы труда, средства труда
   Трудовые ресурсы — часть населения с физическим развитием, знаниями и опытом для работы
   Возрастные группы
    Моложе трудоспособного — до 15 лет включительно
    Трудоспособный — женщины 16–60, мужчины 16–65 лет
    Старше трудоспособного — пенсионный возраст (Ж с 60, М с 65)
   В трудовые ресурсы входят
    Трудоспособные, кроме инвалидов I и II группы и льготных неработающих пенсионеров
    Работающие пенсионеры
    Работающие подростки до 16 лет
   Экономически активное население (рабочая сила)
    Занятые
     Работали по найму или вели доходное дело
     Временно отсутствовали (болезнь, отпуск, забастовка)
     Работали без оплаты на семейном предприятии
    Безработные (16+), одновременно 4 условия
     Нет работы и заработка
     Зарегистрированы в службе занятости
     Искали работу
     Готовы приступить к работе
   Экономически неактивное население
    Учащиеся дневной формы
    Пенсионеры по старости и инвалидности
    Ведущие домашнее хозяйство, ухаживающие за детьми
    Отчаявшиеся найти работу
    Не нуждающиеся в работе
   Персонал организации — работники со знаниями и навыками для выполнения функций
   Профессия — род деятельности (врач)
   Специальность — вид деятельности внутри профессии (врач-хирург)
   Квалификация — уровень подготовки (врач высшей категории)
   Состав персонала
    Основная деятельность
     Рабочие — производственные функции
     Руководители — главные, функциональные, линейные
     Специалисты — инженеры, экономисты, бухгалтеры, менеджеры
     Технические исполнители — документы, учёт, делопроизводство
    Неосновная деятельность — ЖКХ, медицинские, детские учреждения
   Структура кадров — соотношение категорий по возрасту, полу, образованию, квалификации
   Количественная оценка
    Списочная численность — на дату с учётом принятых и выбывших
    Явочная — фактически вышедшие на работу; разница со списочной = неявки
    Среднесписочная за месяц — сумма списочной за все календарные дни / число дней
    Среднесписочная за год — сумма среднемесячных / 12
   Качественная оценка
    Экономические параметры: сложность труда, квалификация, условия, результативность
    Личностные: творческая активность, дисциплинированность, навыки
    Организационно-технические: привлекательность труда, технологическая организация
   Движение персонала
    Абсолютные: оборот по приёму, по увольнению, общий оборот
    Квыб = Чвыб / Ч̄ — доля выбывших
    Кпр = Чпр / Ч̄ — доля принятых
    Ксм — меньшее из принятых и уволенных / Ч̄
    Ктек = Ч′ / Ч̄ — доля уволенных по внеплановым причинам
    Коб = (Чвыб + Чпр) / Ч̄ — общий оборот
    Квк = Чпр / Чвыб — восполнение кадров
    Кпк = (Чн.г. − Чвыб) / Ч̄ — постоянство кадров
   Среднегодовая численность в плане
    Известен месяц: Ч̄ = Чнг ± ΔЧ′ · n / 12, n — полные месяцы работы (неработы)
    Известен квартал: Ч̄ = Чнг ± (ΔЧ1·3,5 + ΔЧ2·2,5 + ΔЧ3·1,5 + ΔЧ4·0,5) / 4
    Время неизвестно: Ч̄ = Чнг ± ΔЧ / 2
   Производительность труда (ПТ)
    Показывает, на какую сумму произвёл продукции каждый работник
    Выработка — продукция на работника в единицу времени
    Трудоёмкость (норма времени) — время на единицу продукции
    Среднегодовая: ПТ = В / Ч̄
    Среднедневная: ПТ = В / Тчел.-дн
    Среднечасовая: ПТ = В / Тчел.-ч
    Выполнение плана: Iпт = ПТфакт / ПТплан · 100
    Оценка эффективности роста ПТ
     Доля прироста выручки за счёт ПТ: q = (1 − ΔЧ / ΔВ) · 100%
      ΔЧ = (Ч̄вып / Ч̄пл − 1) · 100%
      ΔВ = (Ввып / Впл − 1) · 100%
     Условная экономия численности: ΔЧусл = Ч̄усл − Ч̄вып
      Ч̄усл = Ввып / ПТпл — сколько людей понадобилось бы без роста ПТ
     Абсолютная экономия: ΔЧабс = Ч̄вып − Ч̄пл
    Факторы роста ПТ
     Технический уровень: механизация, автоматизация, модернизация, новые техпроцессы
     Организация производства и труда: типовые рабочие места, бригады, планировка
     Прочие: оплата труда, условия, квалификация, снижение текучести
    Резервы роста ПТ — нереализованные возможности: несвоевременность внедрения, неоптимальный выбор
   Техническое нормирование труда
    Определение необходимых затрат труда с учётом техники, технологии, рабочих мест
    Задачи: трудоёмкость, численность, потребность в оборудовании, оценка результатов, фонд зарплаты
    Рабочее время — часть календарного времени выполнения обязанностей по правилам распорядка
    Структура рабочего времени
     Подготовительно-заключительное — подготовка и окончание работы
     Оперативное: основное (изменение предмета труда) + вспомогательное (установка, крепление)
     Обслуживание рабочего места: техническое (заточка, наладка) + организационное (уборка, подача)
     Регламентированные перерывы — отдых, личные надобности, технологические
     Нерегламентированные — нарушения процесса и дисциплины (исключаются из норм)
    Затраты времени: необходимые (нормируемые) / лишние (ненормируемые)
    Нормы труда
     Норма времени: Нвр = Топ + Тоб + Тотл + Тпз = Топ · (1 + К/100)
      К = (Тоб + Тотл + Тпз) / Топ, %
     Норма выработки: индивидуальная Нвыр = Тр / Нвр; коллективная = Тр · Р / Нвр
     Норма обслуживания — число единиц оборудования на работника
     Норма численности — работники для конкретного объёма работ
     Норма управляемости — оптимальное число подчинённых на руководителя
    Методы нормирования
     Суммарные: опытный, опытно-статистический, сравнения
     Аналитические
      Исследовательский: хронометраж (5 шагов), фотография рабочего дня, фотохронометраж
      Расчётный — по нормативам, дешевле хронометража
      Статистический — зависимость норм от факторов, нужен компьютер
     Микроэлементное нормирование — «взять», «переместить» и т.п.
   Оценка персонала
    Помогает руководителю в решениях о повышении результативности
    Применение: приём, обучение, продвижение, сокращение, реорганизация, поощрение
    Направления: кадровое планирование, подбор, обучение, резерв, анализ работы, развитие, стимулирование
    Пример Японии: обязательная периодическая оценка способностей каждого
    Критерии
     Оценка компетенций — знания, умения, поведение; ситуационные задачи
     Оценка результативности — сравнение с плановыми показателями
    Кто оценивает: кадровая служба, эксперты, руководители, коллеги, подчинённые, клиенты, сам работник
    Качественные методы
     Матричный — сравнение с идеальной моделью
     Произвольных характеристик — крупнейшие достижения и нарушения
     Оценка выполнения задач
     «360 градусов» — коллеги, руководители, подчинённые, клиенты, сам работник
     Групповая дискуссия
    Количественные (наиболее объективные)
     Балльный — баллы за достижения
     Ранговый — рейтинги, последние места переводят или увольняют
     Свободной балльной оценки — эксперты оценивают качества
    Комбинированные (наиболее эффективные): метод суммы оценок, система группировки
  2. Основные средства
   Производственные фонды = основные фонды + оборотные средства
   Отличия основных и оборотных
    Участие в производстве: многократно / один раз
    Перенос стоимости: частями по мере износа / полностью
    Натуральная форма: сохраняют / изменяют
    Срок функционирования: от года / до года
   Основные средства — средства труда, многократно участвующие, переносящие стоимость частями, со сроком службы более года
   Не относятся к ОС
    Предметы со сроком службы менее года
    Малоценные (стоимость ниже порога Минфина)
    Специнструменты, спецприспособления, технологическая тара, спецодежда и обувь
   Классификация
    По назначению
     Участвующие в предпринимательской деятельности
     Не участвующие: жилые дома, общежития, детские, спортивные объекты (косвенно влияют на мотивацию)
    По использованию: действующие, на реконструкции, в запасе, на консервации
    По видам (функциям)
     Здания — условия для производства и управления
     Сооружения — инженерно-строительные объекты
     Передаточные устройства — передача энергии
     Машины и оборудование: силовые, рабочие, вычислительная техника, измерительные приборы
     Транспортные средства
     Инструменты, инвентарь, принадлежности
     Прочие: многолетние насаждения, дороги, библиотечные фонды
    По роли: активная часть (непосредственно в производстве) / пассивная (условия: здания, сооружения)
    По принадлежности: собственные / заёмные (аренда, лизинг)
    По возрасту: до 5, 5–10, 15–20, свыше 20 лет
   Методы оценки
    Натуральная — технический состав, мощность, инвентаризация, баланс оборудования
    Стоимостная — рентабельность, амортизация, динамика, износ
    Первоначальная стоимость
     ФП = Ц + Зтр + Зм + Зпр (цена без НДС, транспорт, монтаж, прочее)
     Меняется только при модернизации, реконструкции, достройке, частичной ликвидации или переоценке
     Плюс: простота; минус: разная оценка одинаковых объектов, не учитывает износ
    Восстановительная стоимость — затраты на воспроизводство в современных условиях
     Переоценка не реже раза в год (на 1 января)
     Прямая оценка — по ценам новых аналогов
     Индексный метод: ФВ = ФП · К (здания, сооружения, инструмент, самортизированные ОС)
     Пересчёт валютной стоимости по курсу НБ на 31 декабря
    Остаточная: Фост = ФП(В) − ΣАi
    Рыночная — реальная цена продажи, определяется экспертно
    Балансовая — первоначальная для новых, восстановительная за минусом износа для переоценённых
    Ликвидационная — выручка после утилизации (может быть 0)
    Среднегодовая
     Ф̄ = (Фнг/2 + Ф1.02 + … + Ф1.12 + Фкг/2) / 12
     Для фондоотдачи, рентабельности
   Износ
    Частичная или полная утрата потребительских свойств
    Физический износ
     Снижение мощности, истирание деталей, коррозия; происходит и при бездействии
     Машины изнашиваются быстрее зданий
     Экспертный метод: Изф = Σ di · Pi / 100%
     По сроку службы: Изф = tф / tн = tф / СПИ
     СПИ — период, когда объект приносит экономические выгоды; устанавливает организация
    Моральный износ — обесценение под влиянием НТП
     I формы — удешевление воспроизводства: Изм1 = (ФП − ФВ) / ФП
     II формы — появление более производительной техники: Изм2 = (qн − qс) / qн
     Больше всего подвержена активная часть
     Полный — устраняется только заменой
     Частичный — модернизацией и реконструкцией
   Амортизация
    Перенос стоимости ОС на продукцию; отчисления — источник реновации
    Начисляется ежемесячно в размере 1/12 годовой суммы
    Инструкция № 37/18/6 от 27.02.2009
    Линейный способ — равномерно по годам
     А = Фа · На / 100%
     Фа = ФП(В) − ФЛ (амортизируемая стоимость)
     На = 1 / СПИ · 100%
    Нелинейный: метод суммы чисел лет
     А = Фа · (СПИ − tф) / СЧЛ
     СЧЛ = СПИ · (СПИ + 1) / 2
    Нелинейный: метод уменьшаемого остатка
     А = Фн/а · На · К / 100%
     Фн/а — недоамортизированная стоимость на начало года
     К — коэффициент ускорения до 2,5
    Производительный способ
     Аi = Фа · qi / Q
     qi — выпуск за год; Q — ресурс объекта за весь срок
   Обновление ОС
    Частичное
     Капитальный ремонт — полная разборка, замена деталей, восстановление производительности; периодичность больше года
     Модернизация — изменение конструкции, повышение технического уровня; устраняет моральный износ II формы
    Полное: реконструкция, техническое перевооружение, расширение, новое строительство
    Показатели
     Кобн = Фвв / Фкг · 100%
     Квыб = Фвыб / Фнг · 100%
     Кприроста = (Фвв − Фвыб) / Фнг · 100%
     Срок обновления Тобн = Фнг / Фвв
     Кинт.обн = Фвыб.изн / Фвв.пр — доля новых ОС на замену изношенных
   Лизинг
    Лизингодатель по просьбе лизингополучателя покупает имущество у продавца и передаёт за лизинговые платежи
    Участники: лизингодатель, лизингополучатель, поставщик, объект; иногда банк и страховщик
    Отличия от аренды
     Объект выбирает лизингополучатель
     Срок меньше срока физического износа
     Можно продлить или выкупить по остаточной стоимости
     Лизингодатель — финансовое учреждение
    Состав платежа: возмещение затрат, вознаграждение лизингодателя, НДС
    Виды
     Оперативный — срок меньше амортизации, объект возвращается
     Финансовый — срок ≈ амортизации, погашается ≥ 75% стоимости, возможен выкуп
     Внутренний / международный
     Чистый (обслуживает получатель) / «мокрый» (обслуживает лизингодатель)
     Прямой / косвенный (через посредника) / возвратный (продавец = получатель)
   Показатели использования
    Обобщающие
     Фондоотдача: Кфо = В / Ф̄ — выручка на рубль ОС
     Фондоёмкость: Кфе = Ф̄ / В — ОС на рубль выручки
     Фондовооружённость: Кфв = Ф̄ / Ч̄
     Рентабельность ОС: Рф = П / Ф̄ · 100%
    Частные (активная часть)
     Экстенсивное использование: Кэкс = tф / tк (по времени)
      Календарное время — дни × 24 ч; режимное — по режиму работы
     Интенсивное: Кинт = qф / qв, qв = tф · Нв (по мощности)
     Интегральное: Кинтегр = Кинт · Кэкс
     Задействование: Кзад = Nф / Nн
    Пассивная часть: рентабельность производственной площади
    Пути улучшения: организация производства, качественные ремонты, вовлечение бездействующих ОС, модернизация, квалификация
  3. Оборотные средства
   Денежные средства, авансированные в оборотные фонды и фонды обращения для непрерывного кругооборота
   Совершают кругооборот за один цикл и полностью переносят стоимость
   Кругооборот: деньги → производственные запасы → НЗП → готовая продукция → расчёты → деньги
   I. Оборотные производственные фонды
    Производственные запасы
     Сырьё — требует превращения в материалы
     Основные материалы — превращаются в детали
     Покупные полуфабрикаты — требуют доработки
     Комплектующие — используются на сборке
     Вспомогательные материалы — участвуют, но не входят в продукцию
     Топливо, запасные части, тара
     Малоценные предметы, спецодежда, спецоснастка
    В производстве
     Незавершённое производство
     Полуфабрикаты собственного изготовления
     Расходы будущих периодов
   II. Фонды обращения (носители уже созданной стоимости)
    Готовая продукция на складе
    Отгруженные, но не оплаченные товары
    Денежные средства в кассе и на счетах
    Дебиторская задолженность
   Структура — соотношение элементов; зависит от характера производства, снабжения, сбыта, расчётов
   Нормирование
    Цель — минимально необходимый, но достаточный объём (норматив)
    Методы: расчётно-аналитический (самый прогрессивный), опытно-лабораторный, отчётно-статистический
    Порядок
     1) Нормы запаса по видам (hi, дни)
     2) Среднесуточный расход: Смсут = См / 365
     3) Норматив по элементу: Нi = Смсут · hi
     4) Совокупный норматив: С = Σ Ci
   Источники
    Собственные: уставный капитал, прибыль
    Устойчивые пассивы — задержка выплат зарплаты, налогов, поставщикам
    Заёмные: кредиты банков, кредиторская задолженность, займы
   Показатели эффективности (скорость оборота)
    Коэффициент оборачиваемости: Ко = В / Ос̄ — число оборотов
    Средний остаток: среднее по первым числам месяцев с половинами начального и конечного
    Коэффициент загрузки: Кз = Ос̄ / В
    Длительность оборота: tоб = Д / Ко = Ос̄ · Д / В (Д = 360 или 365)
    Абсолютное высвобождение: ΔОС = ОС / Т · (tоб1 − tоб0)
    Относительное высвобождение: ΔОС = ОС1 − Iв · ОС0
   Пути ускорения оборачиваемости
    Сокращение неплатежей, платёжная дисциплина
    Прогрессивная техника и ресурсосбережение
    Прямые длительные договоры с поставщиками
    Сервисное обслуживание оборудования в контрактах
    Совершенствование нормирования, хранения
    Экономия материалов, топлива, энергии
  4. Нематериальные активы (НМА)
   Признаки
    Нет материально-вещественной формы
    Идентифицируется, отделим от других активов
    Используется в деятельности организации
    Организация получает выгоду и может ограничить доступ
    Срок использования более 12 месяцев
    Не планируется продажа в течение 12 месяцев
    Стоимость можно достоверно определить
   Состав
    Права по лицензионным договорам и франчайзингу
    Объекты авторского права: произведения, компьютерные программы, базы данных
    Смежные права: исполнения, фонограммы, передачи вещания
    Промышленная собственность: изобретения, полезные модели, промышленные образцы, селекционные достижения, топологии микросхем, товарные знаки, ноу-хау
   Амортизация НМА
    Нужно определить: амортизируемую стоимость, способ, СПИ или объём выпуска (делает комиссия)
    Амортизируемая стоимость: первоначальная (переоценённая) или недоамортизированная
    Первоначальная = цена приобретения + пошлины + проценты по кредитам + услуги по приведению в готовность
    Остаточная = первоначальная − накопленная амортизация и обесценение
    СПИ = нормативный срок службы по патенту, лицензии, договору; иначе — решение комиссии
    Линейный — амортизируемая стоимость / СПИ
    Прямой метод суммы чисел лет — числитель: оставшиеся годы
    Обратный метод суммы чисел лет — числитель: СПИ − оставшиеся годы + 1
    Уменьшаемый остаток — коэффициент 1–2,5
    Производительный — выпуск / ресурс объекта
   Эффективность НМА
    Ресурсный подход
     Рентабельность = чистая прибыль / средняя стоимость НМА
     Продуктивность = чистая продукция / средняя стоимость НМА
     Коэффициенты конкурентоотдачи и отдачи качества
     Ёмкость продукции = стоимость НМА / чистая продукция
     Период окупаемости = стоимость НМА / чистая прибыль
    Затратный подход
     Отдача затрат = чистая продукция / затраты на НМА
     Амортоотдача = чистая продукция / амортизация
     Амортизационная рентабельность = чистая прибыль / амортизация
   Направления повышения эффективности: идентификация, капитализация, спецификация, коммерциализация
   Характеристики для коммерциализации
    Тиражируемость — передача без утраты прав
    Размывание прав собственности — быстрое распространение
    Отчуждаемость — часть навыков не отчуждается
    Зависимость от присваивающего субъекта
    Неисчерпаемость знаний
    Возможность и потери, и роста стоимости (репутация)
    Субстанционная несамостоятельность — нужен носитель
 Тема 5. Функционирование организации
  1. Оплата труда
   Заработная плата (ст. 57 ТК РБ) — вознаграждение за труд с учётом сложности, количества, качества, условий, квалификации и отработанного времени
   Функции
    Стимулирующая — заинтересованность в результатах и эффективности
    Воспроизводственная — уровень, обеспечивающий потребности работника и семьи
    Регулирующая — баланс спроса и предложения рабочей силы, занятость
   Принципы в РБ
    Максимальная самостоятельность в выборе форм и систем
    Оплата по количеству и качеству труда
    Заинтересованность в конечном результате
    Социальная защищённость: своевременность, индексация
    Опережающий рост производительности над зарплатой
   Номинальная — сумма денег, полученная за труд
   Реальная — блага, которые можно купить на эту сумму
    Iреал.зп = Iном.зп / Iцен
    Индексация — при инфляции и задержке выплаты
   Факторы уровня зарплаты
    Рыночные: спрос и предложение, взаимозаменяемость ресурсов, полезность
    Нерыночные: госрегулирование, профсоюзы, результаты предприятия, личный вклад
   Двойственность: доход работника (рост) / издержки работодателя (минимизация)
   I. Государственное регулирование
    Минимальная заработная плата
     Низшая граница оплаты за норму времени в нормальных условиях
     Закон № 124-З от 17.07.2002
     С 01.01.2025 — 726 руб.; на 01.01.2024 — 626 руб.; рост 116%
     Факторы: возможности бюджетов и нанимателей, потребности, занятость, ПТ, рост цен
    Базовая величина — с 01.01.2025 42 руб.; для налогов и штрафов
    Бюджет прожиточного минимума — анализ уровня жизни, адресная помощь, обоснование гарантий
    Тарифная система для бюджетных организаций
     Базовая ставка — основа оклада (на 01.01.2024 — 250 руб.)
     18-разрядная тарифная сетка: коэффициенты от 1,00 до 3,00
     Оклад = базовая ставка × коэффициент разряда
     Тарифный разряд — сложность труда и квалификация
     Профессионально-квалификационные группы
     Зарплата = оклад + стимулирующие (надбавки, премии) + компенсирующие (доплаты)
     Надбавка за стаж от базовой ставки: до 5 лет 10%, 5–10 лет 15%, 10–15 лет 20%, свыше 15 лет 30%
     Премии — 20% суммы окладов + неиспользованная экономия
     Оздоровление — 1 оклад в год при отпуске
     Материальная помощь — 0,3 среднемесячной суммы окладов
    ЕТКС — тарифно-квалификационный справочник работ и профессий рабочих: тарификация, разряды, обучение, инструкции
    ЕКСД — справочник должностей служащих: образование и стаж; категории по аттестации
    Другие направления: тарифы, доплаты за особые условия, индексация, учёт рабочего времени, своевременность, ответственность нанимателя
    Удержания: сохраняется не менее 50% зарплаты (кроме алиментов на детей)
    Налогообложение
     Подоходный налог 13%
     25% на доходы свыше 200 000 руб. в год (с 2024)
     Вычеты: 174 руб. при доходе до 1 054; 51 руб. на ребёнка; 97 руб. одиноким и многодетным; 246 руб. отдельным категориям; 620 руб. молодым специалистам
    Трудовые отношения: договор на неопределённый срок, контракт, срочный договор (до 5 лет), на время работы, замещения, сезонный
    Документы при приёме: журнал ознакомления, листы ознакомления, инструктаж, приказ, трудовая книжка
   II. Договорное регулирование: тарифные соглашения, коллективные и трудовые договоры
    Указ № 181 от 10.05.2011
     Новые условия оплаты не должны снижать зарплату
     Гибкие условия, стимулирующие производительность
     Ставки повышаются по эффективности и финансовым возможностям
     Естественные монополии: премии и надбавки в себестоимости до 80% тарифной части
   Планирование фонда оплаты труда
    Цель — оптимальный ФОТ исходя из результатов деятельности
    Задачи: выбор систем, нормирование, средняя зарплата, соотношение с ПТ, налоги, участие работников в прибыли
    1) По достигнутому уровню: ФЗп = ФЗб · Коп ± Эч · Пп
     Минус: переносит нерациональные выплаты базиса; для укрупнённых расчётов
    2) По средней зарплате: ФЗПп = Чрп · ЗПп; ЗПп = ЗПб · Кр
     Точнее, но сложно при инфляции
    3) Нормативный
     Уровневый: ФЗПп = ОПп · Нм
     Норматив: Нзп = ФЗПб / ОПб · (100 + ЗПс) / (100 + ПТ)
     ЗПс = ПТ · Нз (прирост зарплаты на 1% прироста ПТ)
     Приростной: ФЗПп = ФЗПб ± ОП · Нм · ФЗПб / 100
    4) Поэлементный (прямого счёта) — по каждой статье и категории
    Поквартальный ФОТ: ФЗПп.г. · (Ус · Оiп + Уп · Бiп + Уо · Зiп)
  2. Формы и системы оплаты труда
   Повременная форма
    Простая повременная: Зп = Тч · tф = Зм / tрд · tфд
    Повременно-премиальная: Зпп = Зп · (1 + П% / 100%)
    Штатно-окладная — для руководителей и специалистов по штатному расписанию
    Должностной оклад — зависит от должности, квалификации, деловых качеств
   Сдельная форма
    Сдельная расценка: Р = Тч / Нвыр = Тч · Нвр
    Прямая сдельная: Зс = Σ Рi · qi
    Сдельно-премиальная: Зсп = Зс · (1 + (П% + П + ΔП) / 100%)
     Премия по 2–3 показателям; ΔП — проценты перевыполнения плана
    Сдельно-прогрессивная: З = qн · Р + (qф − qн) · Р · Кпр
     Зарплата растёт быстрее ПТ, поэтому для «узких мест»
    Косвенно-сдельная — заработок вспомогательных рабочих от результатов основных
    Аккордная — оплата за весь объём законченной работы; стимулирует сроки (строительство)
    Аккордно-премиальная
    Индивидуальная — по своей выработке
    Коллективная — по общим результатам бригады с КТУ
   Бестарифная — доля в фонде оплаты по квалификации и вкладу
   Контрактная — по контракту с учётом сложности и деловых качеств
   Источник оплаты — выручка от реализации (иногда валовой доход)
   Критерий оптимальности — доля оплаты труда в добавленной стоимости
   Модели соотношения роста ПТ и зарплаты
    I — зарплата опережает ПТ: сдерживает накопление и расширенное воспроизводство
    II — ПТ опережает зарплату: расширенное воспроизводство, но риск потери стимула
    III — пропорционально: без инфляции и со стимулом; приемлема для РБ
   Повышение эффективности ФОТ: нормирование и стимулирование, экономия ресурсов, дешёвые закупки, дисциплина
   Оплата труда в ТЭО проекта
    Основная: Зо = Σ Тдi · Фп · Кпр (Кпр 1,2–1,4)
    Дневная ставка Тд = Тм / Фр; месячная Тм = Тм1р · Тк
    Дополнительная: Зд = Зо · Нд / 100 (Нд 10–20%)
    ЗОТ = Зо + Зд
    Отчисления: ФСЗН 34%; Белгосстрах 0,6% (связь)
  3. Издержки, затраты, себестоимость
   Расходы — потоки денежных средств предприятия
    Направления: долгосрочные активы, материальные ценности, услуги, оплата труда, налоги
    Источники покрытия: капвложения, себестоимость, прибыль, целевое финансирование
   Затраты — расходы на факторы производства (без социальных и благотворительных)
   Вложенность: издержки ⊃ затраты ⊃ расходы ⊃ себестоимость
   Издержки по направлениям
    Производства: материальные затраты, оплата труда, амортизация
    Обращения: транспорт, реклама, хранение, упаковка
    Предприятия: налоги, сборы, отчисления
   Издержки по способу определения
    Бухгалтерские — по элементам на основе норм
    Экономические — явные + неявные
    Альтернативные — упущенные возможности
    Постоянные — не зависят от объёма
    Переменные — меняются с объёмом (сырьё, энергия, зарплата рабочих)
    Средние, общие
    Предельные — прирост издержек на дополнительную единицу
   В ЕАЭС: производственные, административные, торговые, общие, финансовые
   Расходы по текущей деятельности: себестоимость реализованного, управленческие, на реализацию, прочие
   Себестоимость
    Стоимостная оценка сырья, материалов, топлива, энергии, ОФ, НМА, труда на производство и реализацию
    Функции: возмещение затрат, учёт и контроль, основа ценообразования
    Всей продукции / единицы продукции
    Цеховая → производственная (+ общехозяйственные) → полная (+ расходы на реализацию)
    В промышленности — прямые и переменные косвенные; в торговле — стоимость покупки товаров
   Нормативная база учёта
    Закон «О бухгалтерском учёте и отчётности»; инструкции Минфина № 50, 102, 133
    Инструкция № 71/15/50/68 (2022) о калькулировании для ценообразования
    Методические рекомендации Минпрома № 273 (2015)
   Классификация затрат
    По экономическим элементам — однородные затраты для общеэкономических расчётов
    По статьям калькуляции — по функциональной роли, для себестоимости изделия
    Основные / накладные
    Прямые — сразу на конкретный вид (сырьё); косвенные — распределяются пропорционально базе
    Условно-переменные / условно-постоянные
    Простые (один элемент) / комплексные (несколько элементов)
    Производственные / непроизводственные
    Отчётного периода / будущих периодов
   Счета бухучёта
    20 «Основное производство» — прямые затраты
    25 «Общепроизводственные затраты» — амортизация и ремонт производственных ОС, топливо, энергия
    26 «Общехозяйственные расходы» — управленческий персонал, аудит, информационные услуги
    44 «Расходы на реализацию» — упаковка, доставка, хранение, реклама, гарантия
   Калькуляционные статьи (промышленность)
    I. Прямые материальные: сырьё + комплектующие − возвратные отходы + услуги + топливо и энергия
    II. Оплата труда с отчислениями: основная + дополнительная + налоги и отчисления
    III. Всего прямые = I + II
    + подготовка производства, износ инструмента, брак, прочие, общепроизводственные, общехозяйственные
    IV. Фактическая себестоимость
    V. Затраты = IV − экономия + коммерческие расходы
   Калькуляция — расчёт себестоимости калькуляционной единицы
    Единицы: натуральные (изделие, кВт·ч), условно-натуральные (100 пар обуви), трудовые (нормо-час)
    Выбор метода зависит от типа производства, НЗП, длительности цикла, номенклатуры
    Методы
     Простой (попроцессный) — один вид продукции: затраты / количество
     Попередельный — последовательные переделы, полуфабрикат каждого передела калькулируется
     Позаказный — индивидуальное и мелкосерийное производство
     Нормативный — нормы + отклонения (массовое производство)
     Поиздельный — сборка изделий из деталей
    Способы
     Прямого расчёта — затраты объекта / количество
     Исключения затрат на побочную продукцию
     Коэффициентов — перевод в условную продукцию
     Распределения пропорционально базе
     Суммирования затрат по процессам
     Комбинированный
     Суммирования отклонений (нормативный)
   Структура себестоимости
    di = Зi / З · 100%
    Соотношения постоянных и переменных, прямых и косвенных
    Факторы: технический уровень, размещение, характер продукции, снабжение, сбыт, инфляция
    Производства: трудоёмкие, материалоёмкие, энергоёмкие, фондоёмкие, смешанные
   Снижение себестоимости
    Источники (резервы) — статьи затрат, которые нужно сократить
    Факторы — мероприятия для этого
    Рост ПТ: ΔС = (1 − Iзп / Iпт) · dзп
    Экономия материалов: ΔС = (1 − Iн / Iц) · dм
    Постоянные затраты: ΔС = [1 − (dпос / Iв + dпер)] · 100%
    Снижение затрат на 100 руб. доходов: ΔЗ = (С0 · В1 − С1 · В1) / 100
    Внутренние факторы: технические, организационные, структурные
    Внешние: нормы амортизации, цены поставщиков, МЗП, налоги
   Точка безубыточности
    Минимальный объём, при котором выручка покрывает затраты
    Графический метод
     Ось X — объём, ось Y — затраты и выручка
     Линии постоянных, общих издержек и выручки
     Пересечение выручки и общих издержек = ТБ
     Зоны: убытков, безубыточности, прибыли
    Аналитический: Тб = Пост. затраты / (Цена − Перем. затраты на ед.)
     Пример: 60 000 / (4 − 1,2) ≈ 21 429 скачиваний
     В деньгах: Тб × Цена
     Сравнивать с ёмкостью рынка
    Метод маржинального дохода: (Пост + Прибыль план) / (Цена − Перем.)
     Пример: (60 000 + 84 000) / 2,8 ≈ 51 429
    Таргет-костинг — от приемлемой цены к допустимым затратам
  4. Планирование
   План — система решений: цели, задачи, пути, ресурсы, пропорции, организация и контроль
   Планирование — научная разработка мероприятий, определяющих направления и темпы развития
   Методика — методы, способы, приёмы обоснования показателей, структура и порядок плана
   Элементы процесса: анализ → разработка → распределение → фиксация
   Формы организации
    Централизованная — отдел планирования при руководстве
    Децентрализованная — на всех уровнях
    Схемы: «сверху вниз», «снизу вверх», встречное
   Принципы
    Необходимость — повсеместное применение планов
    Единство — сводный взаимоувязанный план
    Непрерывность — планы сменяют друг друга
    Гибкость — возможность корректировок
    Точность — конкретизация по условиям
    Оптимальность — выбор лучшего варианта
    Участие — вовлечение персонала
    Эффективность — наибольший эффект при ограничениях
   Методы
    Балансовый — равенство показателей
    Нормативный — нормы и нормативы
    Сетевой — подготовка производства новой продукции
    Программно-целевой — сложные проекты с многими исполнителями
    Экономико-математический
    Расчётно-аналитический
    Экспериментальный
    Отчётно-статистический
   Виды планирования
    По обязательности: директивное / индикативное
    По сроку: перспективное (> 5 лет), среднесрочное (1–5), текущее (≤ 1 года)
    По назначению: производственные, коммерческие, перспективные, по персоналу
    По продукции: освоенная, осваиваемая, будущая
    По уровням: общефирменные, цеховые, подразделений
    По содержанию
     Стратегическое
      Цель — потенциал выживания в неопределённой среде
      Функции: распределение ресурсов, адаптация, координация, организационные изменения
      Этапы: миссия → цели → анализ среды → альтернативы → выбор стратегии
     Тактическое
      Средство реализации стратегии: как достичь цели
      Решения: НИОКР, мощности, кадры, продажи, издержки, снабжение, финансы
      12 разделов: эффективность, нормы, производство, снабжение, персонал, издержки и прибыль, инновации, инвестиции, экология, социальное развитие, фонды, финансовый план
     Оперативно-календарное
      Конкретизация тактического плана до рабочих мест
      Календарное планирование + диспетчирование
     Бизнес-планирование
      Обоснование мероприятия, особенно инвестиций
      Горизонт 1–5 лет; при создании или переломных моментах
      Этапы: цели → читатели → сбор информации → написание → экспертиза
      Виды: полный, достаточный, «проспект»
      Разделы: резюме, продукция, рынки и маркетинг, производственный, организационный, инвестиционный планы, финансы, эффективность
   Бюджетирование
    Бюджет — ведомость доходов и расходов за период
    Обеспечивает: ресурсы, сбалансированность, платёжеспособность, контроль, синхронизацию функций
    Достоинства: связь денежных потоков, гибкость, статьи для свободных средств
    Недостаток: трудно оценить кассовые разрывы
    Принципы: соответствия источников целям, постоянной потребности в рабочем капитале, избытка денежных средств
 Тема 6. Развитие организации
  1. Инвестиции
   Имущественные и интеллектуальные ценности, вкладываемые ради прибыли или социального эффекта
   Законодательно: имущество, деньги, акции, доли, права требования, иные объекты с оценкой стоимости
   Инвесторы: граждане и юрлица РБ; иностранные инвесторы
   Инвестиционная политика — совокупность действий для развития и получения прибыли от вложений
   Принципы
    Верховенство права
    Равенство инвесторов
    Добросовестность и разумность
    Недопустимость вмешательства в частные дела
    Судебная защита прав
    Приоритет норм международного права
   Объекты: основные фонды, оборотные средства, интеллектуальные ценности, ценные бумаги, научно-техническая продукция, недвижимость
   Классификация
    Реальные (материальные и нематериальные) / финансовые (ценные бумаги, депозиты)
    Активные / пассивные / агрессивные (спекулятивные)
    Краткосрочные (до года) / долгосрочные
    Прямые (ОФ и ОС) / портфельные (ценные бумаги)
    Источники: собственные, заёмные, привлечённые, бюджетные
    Национальные / иностранные
    По доходности: низкая, средняя, высокая (выше доход — выше риск)
    По риску: безрисковые, низкий, средний, высокий
    По ликвидности: высоко-, средне-, низколиквидные
    По совместимости: взаимозависимые, независимые, взаимоисключающие
   Капитальные вложения — инвестиции в воспроизводство ОФ
    Направления: новое строительство, расширение, реконструкция, техническое перевооружение
    Структуры
     Технологическая — СМР, оборудование, проектирование; прогрессивна при росте доли оборудования
     Отраслевая — между отраслями
     Территориальная — между регионами
     Воспроизводственная — по видам воспроизводства
    Производственные / непроизводственные
    Источники: прибыль, амортизация, кредиты, личные средства, иностранные, бюджет, внебюджетные фонды
   Оценка без учёта фактора времени
    Срок окупаемости
     Равные поступления: Ток = К / П̄
     Неравные — прямой подсчёт лет до покрытия затрат
    Индекс рентабельности: Ир = ΣП / К · 100%
    Простая норма прибыли: Нпр = П̄ / К · 100%; сравнивается с банковским процентом
    Недостаток — не учитывают стоимость денег во времени
   Оценка с дисконтированием
    ЧДД (NPV) = Σ Пt / (1 + E)^t − Σ Кt / (1 + E)^t
     E — норма дисконта (ставка рефинансирования)
     ЧДД > 0 — проект эффективен; из вариантов выбирают больший ЧДД
    Индекс доходности: ИД = Σ дисконт. Пt / Σ дисконт. Кt; > 1 — эффективен
    Динамический срок окупаемости — по накопленному дисконтированному доходу
    ВНД (IRR) — ставка, при которой ЧДД = 0; сравнивается с требуемой доходностью
   Стадии проекта (Постановление Минэкономики № 158)
    Прединвестиционная — концепция, бизнес-план
    Инвестиционная — проектирование, строительство, ввод
    Эксплуатационная — функционирование
    Ликвидационная — завершение, консервация
  2. Инновации
   Основные термины
    Новшество (новация) — результат исследований: открытие, патент, ноу-хау, документация
    Коммерциализация — вывод новшества на рынок
    Нововведение — новшество, выведенное на рынок
    Инновация — конечный результат практического применения
    Инновационный лаг — время от новшества до нововведения
   Определение по международным стандартам: новый продукт на рынке, новый процесс или подход к социальным услугам
   Свойства на уровне государства: охраноспособные результаты, патентоспособная продукция, мировой уровень качества, высокая эффективность
   Свойства на уровне компании: новизна, применимость, коммерческая реализуемость
   Критерии успеха для потребителя: значимость, уникальность, устойчивость (патенты), ликвидность
   Шумпетер (1911) «Теория экономического развития»: статика (рутинный кругооборот) и динамика (инновации); кризис как переломный момент
   Функции инноваций
    Воспроизводственная — источник финансирования расширенного воспроизводства
    Инвестиционная — прибыль идёт на инвестиции
    Стимулирующая — побуждает изучать спрос и совершенствоваться
   Классификация
    По типу
     Продуктовые — рост цены или объёма продаж, своя ниша
     Технологические — снижение издержек, рост качества
     Социальные — экономические и управленческие методы, человеческая деятельность (продажа в кредит)
    По потенциалу
     Радикальные (базовые) — принципиально новое, высокий риск; сфера малых фирм
     Улучшающие — самые распространённые, безрисковые; крупные компании
     Комбинаторные — предсказуемый риск, высокая отдача; только крупным
    По отношению к предшественнику: замещающие, отменяющие, возвратные, открывающие, ретровведения
    По механизму: единичные / диффузные
    По процессу: внутриорганизационные / межорганизационные
    По источнику идеи: авторские / заказные
    Обобщённо: инновации-продукты / инновации-процессы

    Риск провала: очень вероятен / маловероятен

    Прямое — целевые программы, госзаказ
    Косвенное — благоприятный климат
    Формы: финансирование, льготные кредиты, венчурные фонды, отсрочка пошлин, технопарки

    Создание — новые подразделения, внутренние венчуры

    Инновационная интеграция — долгосрочные связи с малыми фирмами

    1) Цели: диверсификация, доля рынка, конкурентоспособность, экономия, финансовая устойчивость

   Инновационная активность
    Формы: НИОКР, техпроцессы, испытания, управленческие решения, информация, обучение, маркетинг, патентование

    Бизнес-процессы: технико-технологические, консалтинговые, кадровые, информационные, сбытовые
    Подходы к оценке
     Формальный — число видов деятельности и проектов
     Ресурсный (затратный) — доля персонала в НИОКР, коэффициенты освоения новой техники и продукции, инновационного роста
     Результативный — экономия затрат, вклад в рыночную стоимость

     Балашов — «чёрный ящик»: вход → механизм → выход

    Типы развития: стагнационный, кризисный, экстенсивный, интенсивный, инновационный

    Конкурентное давление: индекс Херфиндаля-Хиршмана, индекс Лернера
  3. Качество продукции
   Совокупность свойств, обусловливающих пригодность удовлетворять потребности по назначению
   Показатель качества — количественная характеристика свойств
   Классификационные — принадлежность к группе, назначение, типоразмер
   Оценочные: функциональные, ресурсосберегающие, природоохранные
   Этапы обеспечения качества
    1) Оценка аналогов и требований покупателей
    2) Долгосрочное прогнозирование
    3) Планирование уровня качества
    4) Разработка стандартов
    5) Проектирование качества при конструировании
    6) Входной контроль сырья
    7) Пооперационный контроль
    8) Приёмочный контроль
    9) Контроль при эксплуатации
    10) Анализ отзывов и рекламаций
   Методы оценки показателей
    По способу: измерительный, регистрационный, органолептический, расчётный
    По источнику: традиционный, экспертный, социологический
   Система показателей: единичные, комплексные, обобщающие
   Обобщающие: доля новой продукции, мирового уровня, экспортной, сертифицированной
   Значение повышения качества: для производителя, потребителя, экономики страны
   Стимулирование
    Материальное — премии, условия в контракте
    Моральное — престиж, знаки отличия
    Организационно-техническое — кружки качества
   Сертификация
    Подтверждение третьей стороной соответствия стандарту
    Документы: ТР, ТКП, СТБ, ГОСТ, СТП, ТУ
    Уровни стандартов: международные, региональные, государственные, предприятий
    Этапы: заявка → решение → испытания образцов → проверка производства → анализ → сертификат → инспекционный контроль
   Эффективность = Качество · Объём / Затраты
    Может расти даже при падении объёма, если качество растёт быстрее
    Эффект проявляется в основном у потребителя
   Факторы качества
    Внутренние: технические, организационные, экономические, социально-психологические
    Внешние: рынок, конкуренция, нормативы, имидж
   Уровень качества
    Сравнение с базовым образцом
    Разрабатываемая продукция — перспективный (гипотетический) образец
    Выпускаемая — мировой уровень или лучшие отечественные
    Технический уровень (без экономических показателей) / технико-экономический
    Дифференциальный метод
     К = Pi / Piб — когда рост показателя улучшает качество (мощность, КПД, срок службы)
     К = Piб / Pi — когда рост ухудшает (масса, расход топлива, примеси)
     Все К ≥ 1 — не ниже базы; все < 1 — ниже
     Смешанные К: главные и второстепенные показатели
    Комплексный метод
     К = Qоц / Qбаз
     Главный показатель как функция единичных: Q = f(n, Pi, Yi)
     Интегральный — полезный эффект на рубль затрат
     Средневзвешенный: Q = Σ mi · Pi / n, Σ mi = 1 (веса экспертно)
    Смешанный — группы комплексных + важнейшие единичные
   Конкурентоспособность
    Предпочтение на рынке по соответствию потребности и затратам
    Относительна: сравнение с конкурентами, конкретный рынок, время
    Рыночные показатели: долгосрочные (тенденции экономики, отрасли, НТП) и краткосрочные (циклы, мода, конкуренты)
    Показатели качества: функциональные, надёжность, эргономические, эстетические
    Экономические: единовременные (цена, доставка, монтаж) и текущие (эксплуатация, ремонт, утилизация)
    Пути повышения: позиционирование, новые применения, оптимизация ассортимента, новые рынки, модификации, сервис, каналы сбыта
 Тема 7. Результативность деятельности
  1. Цена, доходы, выручка
   Цена — денежное выражение стоимости единицы товара
   Тариф — стоимость выполненных работ или услуг
   Ценообразование — установление и применение цен
   Виды цен
    Отпускная — между изготовителем и предприятиями
    Оптово-отпускная — посредник продаёт предприятиям
    Розничная — для населения, цена конечного потребления
    Регулируемая — фиксированная, предельная
    Свободная (рыночная) — по спросу и предложению
   Субъекты ценообразования
    Президент — единая ценовая политика, регуляторы, перечни товаров
    Совет Министров — проведение политики, комиссия по ценообразованию
    МАРТ — проводит ценовую политику
    Облисполкомы и Мингорисполком
    Закон «О ценообразовании»
   Функции цены
    Балансирующая — спрос и предложение
    Учётно-измерительная — исчисление стоимостных показателей
    Распределительная — распределение дохода и ВВП
    Стимулирующая — воздействие на производство и потребление
    Социальная — структура потребления, перераспределение
    Размещение производства — перелив капитала
    Информационная — сигнал о конъюнктуре
   Подходы: затратный (себестоимость + прибыль + налоги) и ценностный
   Методы: от затрат, от спроса и конкуренции, от качества
   Выручка — поступление активов от реализации: Σ цен × объём
   Доходы — экономические выгоды, увеличивающие капитал
    По текущей деятельности: Дтд = Вр + Дпр.тд (продажа ТМЦ, излишки, безвозмездное, господдержка, штрафы)
    По инвестиционной: продажа активов, участие в уставных фондах, проценты, аренда недвижимости
    По финансовой: выкуп акций, долговые бумаги, курсовые разницы
    Добщ = Дтд + Динв + Дфин
  2. Налоги
   Обязательные платежи в бюджет по установленным ставкам и срокам (Налоговый кодекс РБ)
   Функции
    Фискальная — наполнение бюджета
    Регулирующая — льготы стимулируют, высокие ставки сдерживают; социальное перераспределение
    Контрольная — налоговые органы проверяют уплату
   Принципы
    Законность, обязательность, равенство
    Презумпция добросовестности плательщика
    Справедливость — однократное обложение
    Стабильность в течение финансового года
    Гласность, экономическая обоснованность
   Субъекты: органы власти, налоговые инспекции, банки-посредники, плательщики
   Элементы налога
    Объект — доход, выручка, имущество, ФОТ, ввоз и вывоз
    Налоговая база — стоимостная или физическая характеристика
    Ставка: твёрдая / адвалорная (пропорциональная, прогрессивная, регрессивная)
    Налоговый период
    Порядок исчисления
    Льготы
   Классификация
    Прямые (на доходы и имущество) / косвенные (НДС, акцизы)
    Закреплённые / регулирующие (НДС, акцизы, налог на прибыль)
    Республиканские / местные (собаки, курортный, сбор с заготовителей)
    Общие / целевые
   Бюджетная система: республиканский → областные и Минск → базовый уровень → первичный уровень
   Распределение: НДС 75% респ. / 25% местн.; налог на прибыль 30 / 70; подоходный 100% местн.; акцизы и ВЭД 100% респ.
   Республиканские налоги: НДС, акцизы, налог на прибыль, подоходный, на недвижимость, земельный, экологический, за добычу ресурсов, оффшорный, гербовый, пошлины, утилизационный, транспортный
   По базе обложения
    В себестоимости: земельный, ФСЗН 34%, Белгосстрах 0,6%, экологический, на недвижимость 1% (физлица 0,1%)
    Из прибыли: налог на прибыль 20%
    Из выручки: акцизы (спирт, алкоголь, пиво, табак, топливо, масла); НДС 0/10/20/25%, НДС = В · 20 / 120
    С физлиц: подоходный 13%, ИП 16%, резиденты ПВТ 9%; не облагаются алименты, стипендии, пенсии, матпомощь
  3. Прибыль
   Чистый доход — разница между выручкой и затратами
   Виды
    Прибыль от реализации
    По текущей деятельности
    По инвестиционной (продажа ОС, НМА, финвложения)
    По финансовой (изменения капитала, кредиты, курсовые разницы)
    До налогообложения
    Налогооблагаемая
    Льготируемая — республиканские субботники, спонсорская помощь соцучреждениям и обществам инвалидов
    Чистая — конечный финансовый результат
   Методика расчёта
    1) Пр = В − НДС − Ст.п.
    2) НДС = В · Sндс / (100 + Sндс)
    3) Птд = Пр + Дпр.тд − Рпр.тд
    4) Пинв = Динв − Ринв
    5) Пфин = Дфин − Рфин
    6) Пдо н/о = Птд + Пинв + Пфин
    7) Пн/о = Пдо н/о − Пльг
    8) НП = Пн/о · Sнп / 100
    9) Пч = Пдо н/о − НП
   Распределение чистой прибыли (по уставу)
    Резервный фонд — дивиденды при нехватке прибыли, покрытие убытка, зарплата
    Расчёты с учредителями — дивиденды
    Накопление — техника, строительство, НИОКР, жильё и соцобъекты
    Потребление — матпомощь, премии, выплаты по итогам года, питание, путёвки, подарки
   Пример расчёта
    Выручка 755 635,2; ЗОТ 395 717,5; амортизация 13 572,4; материалы 55 535,4; прочие 27 500 тыс. руб.
    ОСН = 395 717,5 · 34% = 134 543,95
    Затраты = 626 869,25
    Пр = 128 765,95; Птд = 133 566,45
    Пинв = 2 500; Пфин = 800 − 600 = 200
    Пдо н/о = 136 266,45; Пн/о = 132 816,45
    НП = 26 563,29; Пч = 109 703,16
    Рентабельность = 17,5%
  4. Рентабельность
   Характеризует прибыльность; считается у прибыльных организаций
   Продукции (организации): П / З · 100% — прибыль на рубль затрат
   Производства: П / (ОС + ОбС) · 100% — прибыль на рубль производственных фондов
   Основных средств: П / ОС · 100%
   Продаж: Пч / В · 100% — прибыль на рубль выручки
  5. Факторы роста прибыли и рентабельности
   Внешние — природа, регулирование цен и тарифов, налоговые льготы, санкции, инфляция
   Внутренние производственные
    Экстенсивные — количество: объём средств труда, время работы, численность
    Интенсивные — качество: производительность оборудования, материалы, технологии, оборачиваемость, ПТ, снижение трудо- и материалоёмкости
   Внутренние внепроизводственные — снабжение и сбыт, природоохрана, социальные условия
  6. Стоимость организации
   Оценка — расчёт стоимости предприятия в деньгах на определённую дату
   Ключевые факторы: время и риск
   Рыночная стоимость — наиболее вероятная цена на открытом рынке при разумных и информированных сторонах; всегда привязана к дате
   Объект оценки — деятельность, направленная на прибыль; состав имущества и прав
   Цели: управление, инвестиционные решения, купля-продажа, доли совладельцев, реструктуризация, план развития, кредитоспособность, страхование, налоги
   Принципы: представления собственника, эксплуатация собственности, рыночная среда
   Подходы
    Доходный — текущая стоимость будущих доходов (принцип ожидания)
     Дисконтирование денежных потоков
     Капитализация доходов
    Затратный — затраты на создание или стоимость активов
    Сравнительный — цены продаж аналогичных предприятий

  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2&&pinch){const [a,b]=[...pts.values()];const r=svg.getBoundingClientRect();zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,pinch.k*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d/T.k)}});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size)svg.classList.remove('drag');setTimeout(()=>moved=false,0)};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
function zoomAt(x,y,f){const k=Math.min(3,Math.max(.08,T.k*f));f=k/T.k;T.x=x-(x-T.x)*f;T.y=y-(y-T.y)*f;T.k=k;apply()}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*.0015))},{passive:false});
// controls
document.getElementById('lv1').onclick=()=>{setDepth(1);matches.clear();render();fit()};
document.getElementById('lv3').onclick=()=>{setDepth(3);render();fit()};
document.getElementById('all').onclick=()=>{setDepth(99);render();fit()};
document.getElementById('fit').onclick=fit;
const leg=document.getElementById('legend');
root.c.forEach(t=>{const b=document.createElement('button');b.innerHTML=`<i style="background:var(${t.col})"></i>`;b.append(t.t.replace(/^Тема (\d)\. /,'$1 · '));
  b.onclick=()=>{all.forEach(n=>n.open=(n===root)||(n===t)||(n.p===t)||(n.d>=2&&isIn(n,t)&&n.d<3));render();fit()};leg.appendChild(b)});
function isIn(n,t){while(n){if(n===t)return true;n=n.p}return false}
let qt;document.getElementById('q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{const q=e.target.value.trim().toLowerCase();matches.clear();
  if(q.length<2){render();return}
  all.forEach(n=>n.open=n.d<1);
  all.forEach(n=>{if(n.t.toLowerCase().includes(q)){matches.add(n);let p=n.p;while(p){p.open=true;p=p.p}}});render();fit()},200)});
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{render();fit()});
window.addEventListener('resize',()=>{});
})();
</script>
